name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: python3 scripts/validate_task_graph.py
      - run: node scripts/scan-secrets.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:task-graph
      - run: pnpm scan:performance-inputs
      - run: pnpm format:check
      - run: pnpm lint
      # Keep TypeScript workers within the GitHub-hosted runner memory budget.
      - run: pnpm exec turbo run typecheck --concurrency=2
      - run: pnpm test:coverage

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  integration:
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://evaluation_test:local-evaluation-test-password@127.0.0.1:5432/evaluation_test
      KEYCLOAK_ADMIN_PASSWORD: local-keycloak-admin-password
      KEYCLOAK_ADMIN_USERNAME: local-admin
      OIDC_AUDIENCE: evaluation-api
      OIDC_ISSUER: http://127.0.0.1:8081/realms/evaluation
      POSTGRES_SUPERUSER_PASSWORD: local-postgres-password
      TEST_DATABASE_URL: postgresql://evaluation_test:local-evaluation-test-password@127.0.0.1:5432/evaluation_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: >-
          docker compose --env-file .env.example --env-file .env.test.example
          -f infra/docker/compose.yml up -d --wait
      - run: pnpm infra:verify
      - run: pnpm db:verify
      - run: pnpm db:deploy
      - name: Run integration tests with local service configuration
        run: |
          set -a
          source .env.example
          source .env.test.example
          set +a
          export APP_ENV=test
          export DATABASE_URL="$TEST_DATABASE_URL"
          pnpm test:integration
      - run: pnpm test:ai
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: >-
          docker compose --env-file .env.example --env-file .env.test.example
          -f infra/docker/compose.yml down --volumes
